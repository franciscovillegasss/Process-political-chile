      <!-- ==================== VISTA 5: ELECCIONES (SERVEL) ==================== -->
      <div id="view-elections" class="main-view hidden h-full space-y-3">
        <div class="bg-white border border-[#A89E88] p-4 rounded shadow-2xs space-y-3">
          <div class="flex justify-between items-center border-b pb-2">
            <div>
              <h3 class="font-extrabold text-sm text-slate-900 uppercase">Calendario electoral de la simulación</h3>
              <span class="text-xs text-stone-500 font-mono" id="elections-cycle-subtitle">Cargos según edad, territorio y ciclo</span>
            </div>
            <div class="flex flex-wrap items-center gap-2">
              <label class="text-xs font-bold">Cargo a disputar
                <select id="election-office" class="ml-1 p-1.5 border rounded bg-white"></select>
              </label>
              <button id="local-register" onclick="window.registerCandidate()" class="px-4 py-1.5 bg-[#0047AB] text-white disabled:opacity-50 font-extrabold text-xs rounded">
                Inscribir candidatura
              </button>
            </div>
          </div>
          <div class="flex flex-wrap gap-2 items-center">
            <p id="registration-recovery" class="text-xs"></p>
            <button onclick="window.buildPoliticalCapital()" class="px-2 py-1 rounded bg-blue-800 text-white text-xs">Trabajo territorial (12 h)</button>
          </div>
          <div class="text-sm whitespace-pre-line" id="elections-calendar-cards" aria-live="polite"></div>
          <div id="runoff-endorsements" class="text-sm"></div>
          <button id="replay-broadcast" onclick="window.replayBroadcast()" class="hidden px-3 py-2 rounded bg-slate-900 text-white">Repetir transmisión</button>
          <dialog id="election-tv" aria-labelledby="tv-title" class="fixed inset-0 m-auto max-h-[90vh] w-[min(94vw,54rem)] overflow-auto rounded-2xl bg-slate-950 text-white shadow-2xl backdrop:bg-slate-950/85 p-5">
            <p class="text-xs tracking-widest uppercase font-bold text-cyan-300">● Señal electoral · simulación</p>
            <h3 id="tv-title" class="text-2xl font-black mt-1"></h3>
            <p id="tv-status" class="text-sm mt-2"></p>
            <progress id="tv-progress" max="100" value="0" aria-label="Progreso del escrutinio" class="w-full accent-cyan-400"></progress>
            <div id="tv-rows" class="grid gap-2 mt-3 sm:grid-cols-2"></div>
            <p id="tv-result" role="status" class="mt-3 whitespace-pre-line font-semibold"></p>
            <div class="mt-4 flex gap-3">
              <button id="tv-pause" class="rounded border border-slate-500 px-3 py-2">Pausar</button>
              <button id="tv-office" class="hidden rounded bg-blue-700 text-white px-3 py-2">Abrir despacho</button>
              <button id="tv-finish" class="rounded bg-cyan-300 text-slate-950 font-bold px-3 py-2">Ver resultado ahora</button>
            </div>
          </dialog>
        </div>
      </div>
